[build]
  command = "pnpm run build:netlify"
  publish = "netlify-dist"

[build.environment]
  LTSV_ACCESS_CODES = '{"m1":"sagar@owner","m2":"sonali@hrd","m3":"vishwatej@bdo","m4":"rohan@30061999","m5":"laxmi@13062006","m6":"priti@23092002","m7":"satish@20072004","m8":"vaishnavi@03062005","m9":"gayatri@21071999","m10":"nandini@08042010"}'
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
